<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body { font: 15px -apple-system, system-ui, sans-serif; min-width: 280px; max-width: 420px; margin: 14px; }
    #status { font-weight: 600; margin-bottom: 10px; }
    #url { width: 100%; box-sizing: border-box; font: 13px ui-monospace, monospace; padding: 8px;
           -webkit-user-select: all; user-select: all; }
    button { margin-top: 10px; width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 0;
             background: #fe2c55; color: #fff; }
    button.secondary { background: #555; }
    .hidden { display: none; }
    #debug { margin-top: 12px; font-size: 11px; opacity: .6; word-break: break-all; }
  </style>
</head>
<body>
  <div id="status">Working…</div>
  <input id="url" readonly>
  <button id="copy">Copy clean link</button>
  <button id="share" class="secondary">Share…</button>
  <button id="open" class="secondary">Open in TikTok app</button>
  <div id="debug"></div>
  <script src="trim.js"></script>
  <script src="popup.js"></script>
</body>
</html>
